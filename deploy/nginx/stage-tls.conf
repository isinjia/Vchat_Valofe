# VChatBot 스테이지 TLS 종료 (compose 의 nginx 컨테이너 전용 — 호스트 설치 아님)
#
# 역할: 포트별 TLS 종료만. 도메인은 vmsg-center-stage.valofe.com 그대로 쓰고 포트로 나눈다.
#   호스트 ${WEB_TLS_443_PORT:-443} → (TLS) → web:5000  (표준 포트 — 주소에 포트 없이 접속)
#   호스트 ${WEB_TLS_PORT:-5000}  → (TLS) → web:5000
#   호스트 ${ADMIN_TLS_PORT:-5001} → (TLS) → admin:5001
# 원본 HTTP 포트(web 5000/admin 5001)는 호스트에 공개하지 않는다 (compose 내부 네트워크 전용).
# web 내부 포트를 3000 이 아닌 5000 으로 쓰는 건 서버 머신 호스트의 다른 3000 프로세스와 혼동 방지.
#
# 인증서: VMessage 와 같은 *.valofe.com — /opt/vmsg/certs 를 읽기 전용 마운트 (compose 참조).
# 그 파일들의 소유자/권한(uid 1000, 600)은 절대 바꾸지 말 것 — VMessage 가 그 설정으로 읽는다.
# (nginx 마스터는 root 로 인증서를 읽으므로 600 이어도 문제없다)

# 497 리다이렉트용: 접속한 포트 그대로 돌려보내되, 표준 포트(443)는 포트 표기를 생략
map $server_port $port_suffix {
    default ":$server_port";
    443     "";
}

# ===== 채팅 서버 (web) — 443(표준)과 5000 둘 다 같은 web 으로 =====
server {
    listen 443 ssl;
    listen 5000 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # http:// 로 잘못 들어온 요청(코드 497)은 같은 포트의 https 로 리다이렉트
    error_page 497 =301 https://$host$port_suffix$request_uri;

    client_max_body_size 120m;             # 영상 일러스트 업로드 (관리툴 설정 videoMaxMb 와 맞출 것)

    # 도커 내장 DNS 로 매번 재해석 — web 컨테이너가 재생성되어 IP 가 바뀌어도 nginx 재시작 불필요
    # (proxy_pass 에 변수를 쓰면 기동 시 1회 해석·고정이 아니라 요청 시 resolver 로 해석한다)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 채팅 SSE 스트림: 버퍼링하면 토큰이 안 흐른다
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ===== 관리툴 (admin) =====
server {
    listen 5001 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # http:// 로 잘못 들어온 요청(코드 497)은 같은 포트의 https 로 리다이렉트
    error_page 497 =301 https://$host:5001$request_uri;

    client_max_body_size 120m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_admin admin;
        proxy_pass http://$upstream_admin:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
